<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hustler Collective</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
       <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand font-weight-bold text-secondary" href="index.html">The Hustler Collective</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <section id="countryinformation">
        <div class="container">
            <div class="row">
                <div class="col text-center">
                    <h1>Country Info</h1>
                    <label for="country">Enter a country to find out more.</label>
                    <br>
                    <input type="text" id="country" placeholder="Country" required>
                    <button id="fetchInfo">Fetch Info</button>
                </div>
            </div>
            <div class="col text-center list-unstyled m-5" id="content">
            </div>
        </div>
    </section>	
    
    <footer class="bg-light py-4 mt-5">

        <div class="container">          
                <div class="col-md-12 text-center mt-3">
                    <p class="mb-0 text-dark">&copy; 2026 The Hustler Collective.</p>
                </div>
            </div>
           
    </footer>

     <script src="./assets/js/countryinfo.js"></script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
